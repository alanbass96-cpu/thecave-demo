<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FamilyFlow">
<link rel="manifest" href="familyflow.webmanifest">
<link rel="apple-touch-icon" href="familyflow-icon-180.png">
<link rel="icon" type="image/png" href="familyflow-icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FamilyFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de uma coluna, abas fixas embaixo; galpão de bodybuilding americano: preto, vermelho da marca, branco de giz e números de uniforme */
:root{
  --rock:#0e0e0f; --rock-2:#18181a; --rock-3:#242427; --line:#333337;
  --chalk:#f2f0ee; --dust:#9d9a98; --ember:#e3342b; --ember-ink:#ffffff; --ember-soft:rgba(227,52,43,.15);
  --moss:#86b96f; --moss-soft:rgba(134,185,111,.16); --danger:#e2654f;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --varsity:"Graduate","Big Shoulders Display",Georgia,serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --card:rgba(22,22,25,.78); --stone-hi:rgba(255,245,235,.035); --stone-lo:rgba(0,0,0,.28); --crack:rgba(0,0,0,.42);
  --glow:rgba(227,52,43,.12); --cave-deep:#050506; --vignette:rgba(0,0,0,.72);
  --pebble:#5e5953; --pebble-edge:#1d1b19; --pebble-hi:#a7a19a; --dust-mote:#d8d0c6; --rock-shade:#bdb5ab; --dust-cloud:rgba(205,196,186,.55); --glow-strong:rgba(227,52,43,.30);
  --chrome-1:#ffffff; --chrome-2:#d2cdc6; --chrome-3:#8a857e;
  --steel-hi:#bdbab3; --steel-lo:#232326; --plate-a:#2d2d32; --plate-b:#141417;
  color-scheme:dark;
}
html,body{background:var(--rock);color:var(--chalk)}
body{font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%;
  background:radial-gradient(120% 60% at 50% -10%,rgba(227,52,43,.12),transparent 60%),var(--rock);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rock)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#cave-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,10,11,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:12px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(to bottom,var(--ember) 0 2px,transparent 2px 3px,var(--chalk) 3px 5px)}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:40px;height:40px;flex:none;color:var(--chalk)}
.brand b{display:block;font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.05em;line-height:.95}
.brand b i{font-style:normal;color:var(--ember)}
.brand span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust);margin-top:3px}
.pill{font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);color:var(--dust);border-radius:99px;padding:4px 10px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.02em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:44px;text-transform:uppercase;letter-spacing:.03em;background:linear-gradient(180deg,var(--chrome-1) 0%,var(--chrome-2) 46%,var(--chrome-3) 54%,var(--chrome-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:20px}
.muted{color:var(--dust)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--dust)}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--rock);border-color:var(--chalk)}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:15px;letter-spacing:.02em;background:var(--rock-3);color:var(--chalk)}
.btn.primary{background:var(--ember);color:var(--ember-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
.link{background:none;border:0;padding:0;color:var(--ember);font-weight:600;text-decoration:none;font-size:14px}

/* Fichas */
.fichas{display:grid;gap:10px}
.ficha{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--rock-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.ficha .letra{font-family:var(--varsity);font-size:32px;line-height:1;color:var(--ember-ink);text-align:center;background:var(--ember);border-radius:8px;padding-block:9px 7px;box-shadow:inset 0 0 0 2px var(--rock),inset 0 0 0 4px var(--chalk)}
.ficha .info{min-width:0}
.ficha .info b{display:block;font-size:17px}
.ficha .info small{color:var(--dust);font-size:13px}
.lvl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.nivel-group{display:flex;flex-direction:column;gap:10px}
.banner{border:1px solid var(--ember);background:var(--ember-soft);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Treino */
.back{background:none;border:0;color:var(--dust);padding:0;font-weight:600;font-size:14px}
.prog{height:6px;border-radius:99px;background:var(--rock-3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ember);transition:width .25s}
.ex{background:var(--rock-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.done{border-color:rgba(134,185,111,.5)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head > div{min-width:0}
.ex-head b{font-size:17px;display:block}
.presc{font-variant-numeric:tabular-nums;color:var(--dust);font-size:14px}
.presc strong{color:var(--chalk);font-weight:700}
.obs{font-size:13px;color:var(--dust);border-left:2px solid var(--line);padding-left:8px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:62px 1fr 48px;gap:8px;align-items:center}
.set label{font-size:13px;color:var(--dust);font-weight:600;font-variant-numeric:tabular-nums}
.kg{display:flex;align-items:center;background:var(--rock);border:1px solid var(--line);border-radius:9px;padding:0 10px}
.kg input{width:100%;min-width:0;background:transparent;border:0;padding:10px 0;font-variant-numeric:tabular-nums;font-weight:600;outline:none}
.kg span{color:var(--dust);font-size:13px}
.kg:focus-within{border-color:var(--ember)}
.chk{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--rock);display:grid;place-items:center;color:var(--dust)}
.chk[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--rock)}
.chk svg{width:20px;height:20px}
.hint{font-size:12px;color:var(--dust)}
.sug{font-size:12.5px;line-height:1.4;color:var(--dust);background:var(--rock-3);border-radius:10px;padding:8px 10px}
.sug b{color:var(--chalk)}
.sug.up b{color:var(--ember)}
.sug.alerta{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(214,120,40,.10)}
.sug.alerta b{color:#b5651d}
.set{grid-template-columns:30px minmax(0,1.25fr) minmax(0,1fr) 44px}
.set-h span{font-size:11px;font-weight:600;color:var(--dust)}
.set label{font-size:13px}
.set.pr label::after{content:""}
.sem-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;background:var(--rock-3);color:var(--dust)}
.sd small{font-size:11px;font-weight:600}
.sd b{font-size:15px;font-weight:800;line-height:1.2}
.sd.tr{background:var(--card);border:1px solid var(--line);color:var(--chalk)}
.sd.hj{outline:2px solid var(--ember);outline-offset:-2px}
.sd.ok{background:var(--ember);border-color:var(--ember);color:#fff}
.sd.falta b{color:var(--danger)}
.sem-ed{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.sem-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center}
.sem-row select{width:100%;min-width:0}
.leve-p{border-color:var(--ember)}
#ovl .ov-bg{position:fixed;inset:0;z-index:40;background:rgba(13,27,51,.42)}
#ovl .ov{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:41;width:100%;max-width:640px;box-sizing:border-box;background:var(--rock-2);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -18px 40px -20px rgba(13,27,51,.5);max-height:88vh;overflow:auto}
.ov-t{font-size:19px;font-weight:800;letter-spacing:-.02em}
.placas{display:flex;align-items:center;gap:4px;min-height:64px;padding:6px 0}
.placas .bar{width:34px;height:8px;border-radius:4px;background:var(--dust);flex:none}
.placas .pl{height:var(--h);min-width:30px;padding:0 4px;border-radius:6px;background:var(--chalk);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.hoje-n .ct{display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.resumo-sem .resumo-n{box-shadow:none;background:var(--rock-3);border:0}
.foco{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.cs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cs-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cs-col .aval-big em{font-style:normal;font-size:15px;color:var(--dust);font-weight:600}
.cs-col.vazio{justify-content:center}
.lemb-b{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chalk);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 14px 30px -18px rgba(13,27,51,.8)}
.lemb-b b{display:block;font-size:14px}.lemb-b small{color:rgba(255,255,255,.72);font-size:12.5px}
.lemb-b .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35);background:transparent}.lemb-b .btn.primary{background:#fff;color:var(--chalk)}
.meu-treino .vol{display:grid;gap:6px}
.vol-l{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;gap:8px;align-items:center;font-size:13px}
.vol-l .mini-prog{width:auto}.vol-l small{color:var(--dust);text-align:right}
.ia-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;width:54px;height:54px;border-radius:50%;border:0;background:var(--chalk);color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:0 12px 26px -10px rgba(13,27,51,.7);display:grid;place-items:center}
.ia-fab span{background:linear-gradient(135deg,#fff,#9fb7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ia-fab.alto{bottom:calc(146px + env(safe-area-inset-bottom,0px))}
.ia-fab[hidden]{display:none}
#ovl .ov.chat{height:88vh;max-height:88vh;gap:10px}
.ia-tag{font-size:11px;font-weight:800;background:var(--chalk);color:#fff;border-radius:99px;padding:2px 7px;vertical-align:middle;margin-left:4px}
.cm-lista{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.cm{display:flex;flex-direction:column;gap:6px;max-width:88%}
.cm.eu{align-self:flex-end;align-items:flex-end}
.cm .bolha{padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;background:var(--rock-3);color:var(--chalk)}
.cm.eu .bolha{background:var(--ember);color:#fff;border-bottom-right-radius:6px}
.cm.ia .bolha{border-bottom-left-radius:6px}
.cm-a{display:flex;flex-wrap:wrap;gap:6px}
.cm-a .chip{color:var(--ember);border-color:var(--ember);white-space:normal;text-align:left}
.cm-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.cm-in input{min-width:0}
.ciclo-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;background:var(--rock-3);border:0;border-radius:12px;padding:11px 12px}
.ciclo-mini b{display:block;font-size:14px}.ciclo-mini small{color:var(--dust);font-size:12.5px}.ciclo-mini .go{color:var(--ember);font-size:18px}
button.ciclo-mini:not(.panel .ciclo-mini){background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:14px 16px}
.ciclo .resumo-n{box-shadow:none;background:var(--rock-3);border:0}
.ci-ex{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:10px}
.ci-ex b{font-size:14px}
.ci-mais summary{cursor:pointer;color:var(--ember);font-weight:600;font-size:14px;padding:6px 0}
.ci-mais[open]{display:flex;flex-direction:column;gap:10px}
.ci-acao{display:flex;flex-direction:column;gap:8px;background:var(--ember-soft);border-radius:12px;padding:12px}
a.btn{display:block;box-sizing:border-box;width:100%;text-align:center;text-decoration:none}
.cs-grid > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.fotos-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.foto-slot{position:relative;aspect-ratio:3/4;border:1px dashed var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;background:var(--rock-3);font-size:12px;font-weight:700;color:var(--dust)}
.foto-slot img,.foto-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-slot.tem{border-style:solid}
.foto-slot.tem span{position:absolute;left:6px;bottom:6px;background:rgba(13,27,51,.72);color:#fff;border-radius:99px;padding:2px 8px;font-size:11px}
.foto-slot input{position:absolute;opacity:0;width:1px;height:1px}
.foto-cmp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.foto-cmp{display:flex;flex-direction:column;gap:6px;min-width:0}
.foto-cmp .ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--rock-3)}
.foto-cmp select{width:100%;min-width:0}
.foto-cmp small{font-size:12px;color:var(--dust);text-align:center}
.sticky-cta{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--rock) 35%);z-index:4}
.sticky-cta > div{max-width:640px;margin:0 auto}
input:disabled,button:disabled{opacity:.45;cursor:not-allowed}

/* Histórico */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--rock-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;display:block;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--dust)}
.panel{background:var(--rock-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel svg{width:100%;height:auto;display:block}
select{background:var(--rock);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}
.sess{display:flex;justify-content:space-between;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess > div{min-width:0}
.sess b{display:block}
.sess small{color:var(--dust);font-size:13px}
.sess .n{font-variant-numeric:tabular-nums;color:var(--dust);font-size:13px;text-align:right;white-space:nowrap}
.note{font-size:13px;color:var(--dust)}

/* Avisos */
.aviso{background:var(--rock-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.aviso p{margin:0;white-space:pre-wrap}
.aviso time{font-size:12px;color:var(--dust);letter-spacing:.06em;text-transform:uppercase}

.horas{display:grid;gap:0}
.hora{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hora:first-child{border-top:0}
.hora b{font-weight:700}
.hora b i{font-style:normal;color:var(--ember);font-weight:600}
/* Formulários */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust);font-weight:600}
.field input,.field textarea,.field select{background:var(--rock);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit-ex{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 input,.edit-ex > input,.edit-ex > select{background:var(--rock);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;min-width:0}

.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--dust);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Execução animada */
.ex-head{justify-content:flex-start;align-items:center;gap:12px}
.ex-txt{flex:1;display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.thumb{width:76px;height:76px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--rock);padding:0;position:relative;overflow:hidden}
.thumb canvas{width:100%;height:100%;display:block}
.thumb .play{position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:50%;background:var(--ember);color:var(--ember-ink);font-size:9px;display:grid;place-items:center;padding-left:2px}
.thumb.none canvas{display:none}
.thumb.none::before{content:"CT";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--varsity);color:var(--line);font-size:22px}
.sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:calc(100% - 20px);overflow:auto;background:var(--rock-2);border-top:3px solid var(--ember);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head > div{min-width:0;display:flex;flex-direction:column;gap:4px}
.x{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:22px;line-height:1;color:var(--chalk)}
.stage{position:relative;width:min(100%,380px);aspect-ratio:1;max-width:100%;margin:0 auto;background:var(--rock);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block}
.phase{position:absolute;left:12px;top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);font-weight:700}
.cues{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.cues li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:baseline}
.cues li b{font-family:var(--varsity);color:var(--ember);font-size:15px}
/* Dinâmico */
.chips.wrap{flex-wrap:wrap;overflow:visible}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1px solid var(--line);background:var(--rock-2);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.seg button[aria-pressed="true"]{border-color:var(--ember);background:var(--ember-soft)}
.seg b{font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.04em}
.seg small{font-size:12px;color:var(--dust)}
.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pf-grid small{display:block;font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.08em}
.pf-grid b{font-size:15px;font-variant-numeric:tabular-nums}
.btn.big{padding:16px;font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.promo{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:linear-gradient(120deg,var(--ember-soft),transparent 70%),var(--rock-2);border-radius:14px;padding:14px}
.promo > span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.promo b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.promo small{color:var(--dust);font-size:13px}
.promo .go{font-size:26px;color:var(--ember);flex:none}
@media (max-width:420px){.pf-grid{grid-template-columns:repeat(2,1fr)}}
#app{padding-top:20px}
/* Caverna + aço */
.ficha,.ex,.panel,.stat,.aviso,.seg button,.promo,.banner{background-color:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding-block:4px 6px}
.impact{position:relative;width:min(62%,270px);margin-top:18px;isolation:isolate}
.impact::before{content:"";position:absolute;left:50%;bottom:-6px;width:150%;height:120%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,var(--glow-strong),transparent 65%);z-index:-1;opacity:0;animation:lg-flash 1.6s ease-out 1.05s forwards}
.hero-logo{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.7));animation:lg-drop 1.25s .1s both}
.hero-logo path{fill:none;stroke:var(--chalk);stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round}
.floor{position:relative;height:3px;margin-top:3px;background:linear-gradient(90deg,transparent,var(--dust) 18%,var(--dust) 82%,transparent);opacity:.55}
.cracks{position:absolute;left:50%;top:1px;width:120%;transform:translateX(-50%);overflow:visible}
.cracks path{fill:none;stroke:var(--dust);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:lg-crack .5s ease-out 1.02s forwards}
.dust{position:absolute;left:50%;bottom:0;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,var(--dust-cloud) 0,transparent 68%);opacity:0;pointer-events:none;animation:lg-dust 1.5s ease-out both}
.impact .chip{position:absolute;left:50%;bottom:2px;width:4px;height:3px;background:var(--rock-shade);border-radius:1px;opacity:0;animation:lg-chip .8s cubic-bezier(.2,.6,.4,1) 1.02s both}
.hero{animation:lg-shake .4s linear 1.0s both}
@keyframes lg-drop{
  0%{transform:translateY(-190%);opacity:0;animation-timing-function:cubic-bezier(.5,0,1,.6)}
  8%{opacity:1}
  72%{transform:translateY(0) scale(1,1);animation-timing-function:ease-out}
  80%{transform:translateY(0) scale(1.07,.88)}
  90%{transform:translateY(-3%) scale(.98,1.03)}
  100%{transform:translateY(0) scale(1,1)}}
@keyframes lg-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,1px)}80%{transform:translate(1px,0)}}
@keyframes lg-flash{0%{opacity:0}18%{opacity:.95}100%{opacity:.35}}
@keyframes lg-crack{to{stroke-dashoffset:0}}
@keyframes lg-dust{0%{opacity:.85;transform:translate(-50%,10%) scale(.3)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(calc(2.6 * var(--s)))}}
@keyframes lg-chip{0%{opacity:1;transform:translate(-50%,0) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(var(--dy) * -.2)) rotate(220deg)}}
.hero.done,.hero.done .hero-logo{animation:none}
.hero.done .dust,.hero.done .impact .chip{display:none}
.hero.done .cracks path{animation:none;stroke-dashoffset:0}
.hero.done .impact::before{animation:none;opacity:.35}
@media (prefers-reduced-motion:reduce){.hero,.hero-logo{animation:none}.dust,.impact .chip{display:none}.cracks path{animation:none;stroke-dashoffset:0}.impact::before{animation:none;opacity:.35}}
.brand-big{font-family:var(--display);font-weight:900;font-size:clamp(48px,15vw,76px);line-height:.88;letter-spacing:.07em;margin-top:0;background:linear-gradient(180deg,var(--chrome-1) 0%,var(--chrome-2) 46%,var(--chrome-3) 54%,var(--chrome-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-cap{display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-cap span{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ember);font-weight:700}
.lenda{border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;
  background-image:radial-gradient(circle,var(--steel-hi) 0 1.8px,var(--steel-lo) 2.4px,transparent 3.2px),radial-gradient(circle,var(--steel-hi) 0 1.8px,var(--steel-lo) 2.4px,transparent 3.2px),radial-gradient(circle,var(--steel-hi) 0 1.8px,var(--steel-lo) 2.4px,transparent 3.2px),radial-gradient(circle,var(--steel-hi) 0 1.8px,var(--steel-lo) 2.4px,transparent 3.2px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(160deg,var(--plate-a),var(--plate-b) 62%,var(--plate-a));
  background-size:12px 12px,12px 12px,12px 12px,12px 12px,auto,auto;
  background-position:6px 6px,calc(100% - 6px) 6px,6px calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),0 0,0 0;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat,no-repeat}
.lenda::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(to bottom,var(--ember) 0 2px,transparent 2px 3px,var(--chalk) 3px 5px)}
.lenda-top{display:flex;gap:16px;align-items:center;padding:22px 18px 14px}
.lenda-id{display:flex;flex-direction:column;gap:3px;min-width:0}
.lenda h3{font-size:27px;text-transform:uppercase;letter-spacing:.02em}
.lenda small{color:var(--dust);font-size:13px}
.titulos{font-family:var(--varsity);font-size:54px;line-height:.9;color:var(--ember);-webkit-text-stroke:2px var(--chalk);paint-order:stroke fill;text-shadow:3px 3px 0 var(--cave-deep);flex:none}
.lenda-fichas{display:grid}
.lf{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(0,0,0,.22);border:0;border-top:1px solid var(--line);padding:13px 18px;text-align:left;width:100%}
.lf > span:first-child{min-width:0}
.lf b{display:block;font-size:16px}
.lf small{color:var(--dust);font-size:13px}
.lf .go{color:var(--ember);font-size:20px;flex:none}
.lf:hover{background:var(--ember-soft)}
@media (max-width:380px){.titulos{font-size:44px}}
/* Nutrição */
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.metas small{display:block;font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.08em}
.metas b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.refs > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.refs ul{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.refs li b{color:var(--chalk)}
.supl{display:grid;gap:10px}
.sup{background-color:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.sup b{font-size:17px;margin-right:8px}
.dose{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ember);text-align:right;white-space:nowrap}
.sup p{margin:0}
.sup small{color:var(--dust);font-size:13px}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);color:var(--dust);border-radius:99px;padding:3px 9px}
.tag.base{border-color:var(--ember);color:var(--ember)}
@media (max-width:480px){.refs{grid-template-columns:1fr}.metas b{font-size:21px}}
nav.tabs button{font-size:11px}
/* Professor */
.ficha.aluno .info small{display:block}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.22);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ember);flex:none;margin:1px 0 0}
.check span{min-width:0}
.check small{display:block;color:var(--dust);font-size:12px}
.recado{border-color:var(--ember)}
.recado p{margin:0;white-space:pre-wrap}
/* Avaliação */
.aval.due{border-color:var(--ember)}
.aval-big{font-family:var(--display);font-weight:800;font-size:32px;text-transform:uppercase;line-height:1}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.crit li{display:grid;grid-template-columns:20px 1fr;gap:6px;color:var(--dust);font-size:14px}
.crit li span{font-weight:700}
.crit li.ok{color:var(--chalk)}
.crit li.ok span{color:var(--moss)}
.al-tags{margin-top:4px}
/* Cronômetro, recordes, avaliação física */
.timer{position:fixed;left:0;right:0;top:0;z-index:25;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(14,14,15,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--ember)}
.t-row{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
#t-nome{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#t-time{font-family:var(--display);font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;display:block}
.timer .prog{max-width:640px;margin:8px auto 0}
.set.pr .kg{border-color:var(--moss)}
.set.pr label{color:var(--moss)}
.set.pr label::after{content:" · recorde";font-size:11px}
.fis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.08em;font-weight:600;border-top:0}
/* Conquistas e cupons */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;background:rgba(0,0,0,.22)}
.badge i{font-style:normal;font-family:var(--varsity);font-size:15px;color:var(--ember-ink);background:var(--ember);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--rock),inset 0 0 0 4px var(--chalk)}
.badge b{font-size:13px;line-height:1.15}
.badge small{font-size:11px;color:var(--dust)}
.badge.off{opacity:.5}
.badge.off i{background:var(--rock-3);color:var(--dust);box-shadow:inset 0 0 0 2px var(--rock),inset 0 0 0 4px var(--line)}
.cupom{border:2px dashed var(--ember);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--ember-soft)}
.cupom code,.cp{font-family:var(--varsity);font-size:24px;letter-spacing:.06em;color:var(--chalk)}
.cp{font-size:16px}
.cupom.usado{opacity:.5;border-color:var(--line);background:transparent}
/* Boas-vindas */
.onb{display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.onb .hero{padding-block:24px 8px}
.ou{display:flex;align-items:center;gap:10px;color:var(--dust);font-size:12px;text-transform:uppercase;letter-spacing:.14em}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--line)}
/* Barra da demonstração */
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;flex-wrap:wrap}
.seg2{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--card)}
.seg2 button{border:0;background:transparent;border-radius:99px;padding:7px 16px;font-weight:700;font-size:13px;color:var(--dust)}
.seg2 button[aria-pressed="true"]{background:var(--ember);color:var(--ember-ink)}
/* Abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--rock-2);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs > div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dust);font-size:12px;font-weight:600;letter-spacing:.04em;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ember)}
.dot{position:absolute;top:12px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--ember)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--rock);font-weight:700;padding:10px 16px;border-radius:99px;z-index:20;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){h1{font-size:34px}.stat b{font-size:28px}}

/* ===== FamilyFlow: branco e azul, limpo e premium ===== */
/* Layout: uma coluna de cartões brancos sobre papel levemente azulado; azul profundo como cor de ação */
:root{
  --rock:#F5F7FB; --rock-2:#FFFFFF; --rock-3:#EEF2F8; --line:#E2E8F1;
  --chalk:#0D1B33; --dust:#5E6E86; --ember:#1E4BB0; --ember-ink:#FFFFFF; --ember-soft:rgba(30,75,176,.08);
  --moss:#16946A; --moss-soft:rgba(22,148,106,.10); --danger:#C93C3C;
  --card:#FFFFFF; --rock-shade:#C9D3E3; --dust-cloud:rgba(30,75,176,.15); --pebble-edge:#C9D3E3; --dust-mote:#9FB0C8;
  --glow-strong:rgba(30,75,176,.12);
  --chrome-1:#0D1B33; --chrome-2:#0D1B33; --chrome-3:#0D1B33;
  --display:"Manrope","Segoe UI",system-ui,sans-serif; --body:"Manrope","Segoe UI",system-ui,sans-serif; --varsity:"Manrope","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(13,27,51,.04),0 10px 28px -14px rgba(13,27,51,.18);
  color-scheme:light;
}
html,body{background:var(--rock);color:var(--chalk)}
body{background:var(--rock);font-feature-settings:"tnum" 0}
#cave-bg{display:none}
h1,h2,h3,.seg b,.promo b,.aval-big,.btn.big,.brand-big,.lenda h3,.stat b,.metas b,.hero-cap b,.dose,#t-time{font-family:var(--display);text-transform:none;letter-spacing:-.02em}
h1{font-size:34px;font-weight:800;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--chalk)}
h2{font-size:21px;font-weight:800}
.brand-big{font-size:clamp(40px,12vw,58px);font-weight:800;color:var(--chalk);-webkit-text-fill-color:currentColor;background:none}
.hero-cap span{color:var(--ember);letter-spacing:.18em}
.eyebrow,.lvl{color:var(--dust);letter-spacing:.12em}
.ficha,.ex,.panel,.stat,.sup,.banner,.promo,.empty,.aviso{background:var(--card)!important;border-color:var(--line);box-shadow:var(--shadow);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:18px}
.empty{border-style:solid}
.banner{border-color:var(--line);background:linear-gradient(135deg,var(--ember-soft),transparent 70%),var(--card)!important}
.promo{background:linear-gradient(135deg,var(--ember-soft),transparent 75%),var(--card)!important}
.promo .go{color:var(--ember)}
.btn{border-radius:12px;font-weight:700;letter-spacing:0;background:var(--rock-3);color:var(--chalk)}
.btn.primary{background:var(--ember);color:var(--ember-ink);box-shadow:0 8px 20px -10px rgba(30,75,176,.6)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.big{font-size:17px;font-weight:800}
.chip{background:var(--card);border-color:var(--line);color:var(--dust)}
.chip[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:#fff}
.ficha .letra{font-family:var(--display);font-weight:800;font-size:26px;background:var(--ember-soft);color:var(--ember);box-shadow:none;border-radius:14px;padding-block:12px}
.badge{background:var(--rock-3);border-color:var(--line)}
.badge i{font-family:var(--display);font-weight:800;font-size:13px;background:var(--ember);color:#fff;box-shadow:0 6px 14px -8px rgba(30,75,176,.7)}
.badge.off i{background:var(--card);color:var(--dust);box-shadow:inset 0 0 0 1.5px var(--line)}
.lf{background:transparent}.lf:hover{background:var(--ember-soft)}
.check{background:var(--rock-3)}
.kg,select,.field input,.field textarea,.field select,.grid3 input,.edit-ex > input,.edit-ex > select{background:var(--card);border-color:var(--line)}
.chk{background:var(--card);border-color:var(--line)}
.chk[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#fff}
.prog{background:var(--rock-3)}
.thumb{background:var(--rock-3);border-color:var(--line)}
.thumb .play{background:var(--ember);color:#fff}
.stage{background:var(--rock-3);border-color:var(--line)}
.sheet{background:var(--card);border-top:0;box-shadow:0 -10px 40px -10px rgba(13,27,51,.25)}
.sheet-wrap{background:rgba(13,27,51,.35)}

.timer{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
nav.tabs{background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav.tabs button{color:var(--dust);font-size:12px}

.toast{background:var(--chalk);color:#fff;box-shadow:var(--shadow)}
.tag{border-color:var(--line);color:var(--dust)}
.tag.base{border-color:transparent;background:var(--ember-soft);color:var(--ember)}
.set.pr .kg{border-color:var(--moss)}
.tbl th,.tbl td{border-color:var(--line)}
.ff-top{display:flex;justify-content:space-between;align-items:center;padding-block:6px 4px}
.ff-mark{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--chalk)}
.ff-mark::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ember);margin-left:3px;vertical-align:baseline}
.ff-top span{font-size:13px;color:var(--dust)}
h1{font-weight:700;letter-spacing:-.03em}
.brand-big{font-weight:700;letter-spacing:-.04em}
label.btn{display:block;box-sizing:border-box;width:100%}
.onb .brand-big::after{content:"";display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--ember);margin-left:.06em}
.onb .hero{padding-block:36px 8px}
.lenda{background:var(--card)!important;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}
.lenda::after{content:none}
.titulos{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.04em;color:var(--ember);-webkit-text-stroke:0;text-shadow:none}
.lenda h3{text-transform:none;font-size:23px;font-weight:800}
.lf{border-top:1px solid var(--line)}
.ref{gap:10px}
.ref-n{font-size:17px}
.ref-it{margin:0;padding-left:18px;display:grid;gap:5px;font-size:15px}
.ref-it .muted{color:var(--dust)}
.ref .chips{gap:6px;padding:0;margin:0}
.ref .chip{padding:6px 11px;font-size:13px}
.compras summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;cursor:pointer;list-style:none}
.compras summary::-webkit-details-marker{display:none}
.compras[open] summary{margin-bottom:6px}
.aval-big{display:block}
.meta-big{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.esp{border:1px solid var(--line)}
.niveis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.niveis span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dust);text-align:center}
.niveis b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--rock-3);color:var(--dust);font-size:13px}
.niveis .ok b{background:var(--moss);color:#fff}.niveis .ok{color:var(--chalk)}
.niveis .atual b{background:var(--ember);color:#fff;box-shadow:0 6px 14px -8px rgba(30,75,176,.7)}.niveis .atual{color:var(--chalk);font-weight:700}
.eyebrow,.lvl{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
h1{font-size:30px}
.pg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ember);font-weight:800;font-size:14px;box-shadow:var(--shadow);flex:none}
.hoje{background:var(--chalk);color:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:0 22px 44px -24px rgba(13,27,51,.7)}
.hoje .eyebrow{color:rgba(255,255,255,.62)}
.hoje .presc{color:rgba(255,255,255,.75)}
.hoje-t{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hoje .btn.primary{background:#fff;color:var(--chalk);box-shadow:none;margin-top:8px}
.linha,.links,.hoje,.resumo-n{box-sizing:border-box}
.linha{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;text-align:left;box-shadow:var(--shadow)}
.linha b{display:block;font-size:15px}.linha small{color:var(--dust);font-size:13px}.linha .go{color:var(--ember);font-size:20px}
.mini-prog{width:72px;height:6px;border-radius:99px;background:var(--rock-3);overflow:hidden;flex:none}.mini-prog i{display:block;height:100%;background:var(--ember)}
.links{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.links .lf:first-child{border-top:0}
.resumo-n{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.resumo-n b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.resumo-n b em{font-style:normal;font-size:12px;font-weight:600;color:var(--dust);margin-left:2px}
.resumo-n small{font-size:11px;color:var(--dust)}
.resumo-n.tres{grid-template-columns:repeat(3,minmax(0,1fr));padding:16px 8px}.resumo-n.tres b{font-size:24px}
.evo-tabs{display:flex}.evo-tabs button{flex:1;padding:9px 0}
.seg2{border-color:var(--line);background:var(--rock-3)}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--chalk);box-shadow:0 2px 6px rgba(13,27,51,.12)}
.sup-l{display:grid;gap:12px;margin-top:4px}.sup-l > div{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.sup-l b{display:block}.sup-l small{color:var(--dust);font-size:13px}.sup-l .dose{font-size:15px;color:var(--ember)}
.seg .sug{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);line-height:1}

function solveSide(t,P){
  let hip;
  if(t.anchor==="foot"){ const knee=sub(t.at,V(P.shin,L.SH)); hip=sub(knee,V(P.thigh,L.TH)); }
  else if(t.anchor==="hand"){ const el=sub(t.at,V(P.farm,L.FA)); const sh=sub(el,V(P.uarm,L.UA)); hip=sub(sh,V(P.torso,L.TO)); }
  else hip=[t.at[0],t.at[1]];
  hip=add(hip,[P.dx||0,P.dy||0]);
  const J={hip}; J.sh=add(hip,V(P.torso,L.TO)); J.head=add(J.sh,V(P.headA??P.torso,7+L.R));
  J.elbow=add(J.sh,V(P.uarm,L.UA)); J.hand=add(J.elbow,V(P.farm,L.FA));
  J.knee=add(hip,V(P.thigh,L.TH)); J.ankle=add(J.knee,V(P.shin,L.SH));
  J.elbow2=add(J.sh,V(P.uarm2??P.uarm,L.UA)); J.hand2=add(J.elbow2,V(P.farm2??P.farm,L.FA));
  J.knee2=add(hip,V(P.thigh2??P.thigh,L.TH)); J.ankle2=add(J.knee2,V(P.shin2??P.shin,L.SH));
  J.toe = t.toe ? [t.at[0]+11,t.at[1]] : add(J.ankle,V(P.footA??(P.shin+90),9));
  J.toe2 = t.toe ? [t.at[0]+8,t.at[1]] : add(J.ankle2,V(P.footA??((P.shin2??P.shin)+90),9));
  return J;
}
function solveFront(t,P){
  const tl=P.seat?16:L.TH; let hip;
  if(t.anchor==="foot") hip=[t.at[0], t.at[1]-Math.cos(P.thigh*RAD)*tl-Math.cos(P.shin*RAD)*L.SH];
  else if(t.anchor==="hand") hip=[t.at[0], t.at[1]-Math.cos(P.farm*RAD)*L.FA-Math.cos(P.uarm*RAD)*L.UA+L.TO];
  else hip=[t.at[0],t.at[1]];
  hip=add(hip,[P.dx||0,P.dy||0]);
  const sy=hip[1]-L.TO, VL=(a,l)=>{const v=V(a,l); return [-v[0],v[1]];};
  const J={hip, shR:[hip[0]+19,sy], shL:[hip[0]-19,sy], hipR:[hip[0]+9,hip[1]], hipL:[hip[0]-9,hip[1]], neck:[hip[0],sy], head:[hip[0],sy-7-L.R]};
  J.elR=add(J.shR,V(P.uarm,L.UA)); J.haR=add(J.elR,V(P.farm,L.FA));
  J.elL=add(J.shL,VL(P.uarm,L.UA)); J.haL=add(J.elL,VL(P.farm,L.FA));
  J.knR=add(J.hipR,V(P.thigh,tl)); J.anR=add(J.knR,V(P.shin,L.SH));
  J.knL=add(J.hipL,VL(P.thigh,tl)); J.anL=add(J.knL,VL(P.shin,L.SH));
  return J;
}
function poly(c,K,pts){ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); c.fillStyle=K.bg; c.fill(); c.lineWidth=3.5; c.strokeStyle=K.fig; c.stroke(); }
function figSide(c,K,J,P){
  c.strokeStyle=K.fig; c.globalAlpha=.32; line(c,[J.hip,J.knee2,J.ankle2,J.toe2],5); line(c,[J.sh,J.elbow2,J.hand2],5); c.globalAlpha=1;
  const n=nrm(P.torso);
  poly(c,K,[add(J.sh,mul(n,-9)),add(J.sh,mul(n,8)),add(J.hip,mul(n,5)),add(J.hip,mul(n,-5))]);
  circ(c,J.head,L.R,K.bg,K.fig,3.5);
  c.strokeStyle=K.fig; line(c,[J.hip,J.knee,J.ankle,J.toe],6.5); line(c,[J.sh,J.elbow],7.5); line(c,[J.elbow,J.hand],6);
}
function figFront(c,K,J){
  c.strokeStyle=K.fig; line(c,[J.hipL,J.knL,J.anL,add(J.anL,[-7,0])],6.5); line(c,[J.hipR,J.knR,J.anR,add(J.anR,[7,0])],6.5);
  c.strokeStyle=K.fig; line(c,[J.neck,add(J.neck,[0,-6])],5);
  poly(c,K,[J.shL,J.shR,J.hipR,J.hipL]);
  circ(c,J.head,L.R,K.bg,K.fig,3.5);
  c.strokeStyle=K.fig; line(c,[J.shL,J.elL],7.5); line(c,[J.elL,J.haL],6); line(c,[J.shR,J.elR],7.5); line(c,[J.elR,J.haR],6);
}
function prep(t){ if(!t._p){ t.A={...t.base,...t.A}; t.B={...t.base,...t.B}; t._p=1; } return t; }
function pose(t,k){ const P={}; for(const key in t.A){ const a=t.A[key], b=key in t.B?t.B[key]:a; P[key]=(typeof a==="number"&&typeof b==="number")?a+(b-a)*k:a; } for(const key in t.B) if(!(key in P)) P[key]=t.B[key]; return P; }
function colors(){ const s=getComputedStyle(document.documentElement), g=v=>s.getPropertyValue(v).trim(); return {fig:g("--chalk"),bg:g("--rock"),steel:g("--dust"),red:g("--ember"),line:g("--line")}; }
function draw(cv,key,k,ex,K){
  const t=prep(T[key]); const w=cv.getBoundingClientRect().width||100; const dpr=Math.min(3,window.devicePixelRatio||1);
  const W=Math.max(60,Math.round(w*dpr)); if(cv.width!==W){ cv.width=W; cv.height=W; }
  const c=cv.getContext("2d"); c.setTransform(W/200,0,0,W/200,0,0); c.clearRect(0,0,200,200);
  c.lineCap="round"; c.lineJoin="round"; K=K||colors();
  c.strokeStyle=K.line; line(c,[[6,G+1.5],[194,G+1.5]],2);
  const P=pose(t,k), J=t.view==="front"?solveFront(t,P):solveSide(t,P);
  if(t.props) t.props(c,K,J,P,ex,"back");
  (t.view==="front"?figFront:figSide)(c,K,J,P);
  if(t.props) t.props(c,K,J,P,ex,"front");
}
const ease=x=>.5-.5*Math.cos(Math.PI*x);
const kAt=c=> c<.16?0 : c<.44?ease((c-.16)/.28) : c<.56?1 : 1-ease((c-.56)/.44);
const DUR=3400;
const st={raf:0,key:null,ex:null,t:0,last:0,paused:false,speed:1,K:null,phase:""};
function loop(ts){
  if(!st.key) return;
  const dt=st.last?Math.min(100,ts-st.last):0; st.last=ts; if(!st.paused) st.t+=dt*st.speed;
  const c=(st.t%DUR)/DUR; draw(document.getElementById("sh-c"),st.key,kAt(c),st.ex,st.K);
  const ph = c<.16?"Posição inicial" : c<.44?"Fase concêntrica" : c<.56?"Contração no pico" : "Volta controlada";
  if(ph!==st.phase){ st.phase=ph; document.getElementById("sh-p").textContent=ph; }
  st.raf=requestAnimationFrame(loop);
}
function open(ex,i){
  if(!ex) return;
  const key=keyFor(ex), sheet=document.getElementById("sheet");
  document.getElementById("sh-t").textContent=ex.nome;
  document.getElementById("sh-e").textContent=`Exercício ${i+1} · ${ex.series} × ${ex.reps||""}`;
  const stage=document.getElementById("sh-stage"), none=document.getElementById("sh-none"), ctl=document.getElementById("sh-ctl");
  stage.hidden=!key; ctl.hidden=!key; none.hidden=!!key;
  const cues=key?T[key].cues.slice():[]; if(ex.obs) cues.push(ex.obs);
  document.getElementById("sh-cues").innerHTML=cues.map((t,n)=>`<li><b>${n+1}</b><span>${esc(t)}</span></li>`).join("");
  sheet.hidden=false; document.body.style.overflow="hidden";
  cancelAnimationFrame(st.raf); st.key=key; st.ex=ex; st.t=0; st.last=0; st.paused=false; st.phase=""; st.K=colors();
  document.getElementById("sh-pause").textContent="Pausar";
  if(key) st.raf=requestAnimationFrame(loop);
  document.getElementById("sh-x").focus();
}
function close(){ cancelAnimationFrame(st.raf); st.key=null; const s=document.getElementById("sheet"); if(s && !s.hidden){ s.hidden=true; document.body.style.overflow=""; } }
function pause(){ st.paused=!st.paused; document.getElementById("sh-pause").textContent=st.paused?"Continuar":"Pausar"; }
function speed(){ st.speed = st.speed===1?.5:1; document.getElementById("sh-vel").textContent = st.speed===1?"Câmera lenta":"Velocidade normal"; }
function thumbs(f){
  if(!f) return; const K=colors();
  document.querySelectorAll("canvas[data-thumb]").forEach(cv=>{ const ex=(f.exercicios||[])[+cv.dataset.thumb]; const k=keyFor(ex); if(k) draw(cv,k,1,ex,K); else cv.closest(".thumb").classList.add("none"); });
}
function options(x){
  const auto=match(x.nome);
  return `<option value="">Animação automática · ${auto?T[auto].label:"nenhuma encontrada"}</option>` + Object.entries(T).map(([k,t])=>`<option value="${k}" ${x.anim===k?"selected":""}>${t.label}</option>`).join("");
}
return {open,close,pause,speed,thumbs,options,keyFor};

const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmtDesc = d => d<120 ? `${d}s` : `${Math.floor(d/60)}min${d%60?String(d%60).padStart(2,"0"):""}`;

function sugestaoFoco(){
  const lvl = NIVEIS.indexOf((!S.owner&&S.lib&&S.lib.nivel)||S.perfil.nivel);
  const cands = lvl<=0 ? ["corpo","superiores","inferiores"] : ["peito_triceps","costas_biceps","pernas","ombros_bracos"];
  const last = {};
  S.sessoes.forEach(s=>(s.exs||[]).forEach(e=>{ if(!e.sets.some(x=>x.feito)) return; const g=GRUPO_ANIM[ANIM.keyFor(e)]; const t=Date.parse(s.fim); if(g && (!last[g] || t>last[g])) last[g]=t; }));
  let key=cands[0], tMin=Infinity;
  cands.forEach(k=>{ const t=Math.min(...FOCOS[k].main.map(g=>last[g]||0)); if(t<tMin){ tMin=t; key=k; } });
  let motivo;
  if(!tMin) motivo = "ainda sem treino registrado desse grupo";
  else { const d=Math.floor((Date.now()-tMin)/864e5); motivo = d>=1 ? `${d===1?"1 dia":d+" dias"} sem treinar esse grupo` : "para equilibrar a semana"; }
  return {key, motivo};
}

function gerarTreino(focoKey, intens){
  const p=S.perfil, lvl=Math.max(0,NIVEIS.indexOf((!S.owner&&S.lib&&S.lib.nivel)||p.nivel)), F=FOCOS[focoKey], obj=p.objetivo;
  const evitar = new Set(((S.dyn&&S.dyn.exercicios)||[]).map(e=>e.nome));
  const plan = F.plan.map(([g,n])=>[g,n]);
  if(intens==="leve"){ let bi=0; plan.forEach((x,i)=>{ if(x[1]>plan[bi][1]) bi=i; }); plan[bi][1]=Math.max(1,plan[bi][1]-1); }
  if(intens==="forte"){ const m=plan.find(x=>x[0]===F.main[0]); if(m) m[1]++; }
  if(lvl===0){ let tot=plan.reduce((a,x)=>a+x[1],0); for(let i=plan.length-1; tot>6 && i>=0; i--){ while(plan[i][1]>1 && tot>6){ plan[i][1]--; tot--; } } }
  const used=new Set(), exs=[];
  plan.forEach(([g,n])=>{
    let pool = LIB.filter(e=>e[1]===g && e[4]<=lvl);
    const fresh = pool.filter(e=>!evitar.has(e[0])); if(fresh.length>=n) pool=fresh;
    shuffle(pool);
    const comp=pool.filter(e=>e[3]), iso=pool.filter(e=>!e[3]), anims=new Set(), picks=[];
    for(let k=0;k<n;k++){
      const wantComp = k===0 || (k===1 && n>=3);
      const order = wantComp ? [comp,iso] : [iso,comp];
      let pick=null;
      for(const src of order){ const i=src.findIndex(e=>!anims.has(e[2])); if(i>=0){ pick=src.splice(i,1)[0]; break; } }
      if(!pick) for(const src of order){ if(src.length){ pick=src.shift(); break; } }
      if(!pick) break;
      anims.add(pick[2]); picks.push(pick);
    }
    picks.sort((a,b)=>b[3]-a[3]).forEach(e=>{ used.add(e[0]); exs.push(prescrever(e,obj,lvl,intens,!!p.retorno)); });
    if(intens==="forte" && !p.retorno && F.main.includes(g)){ const lastIso=[...exs].reverse().find(x=>x._g===g && !x._c); if(lastIso) lastIso.obs="Drop set na última série"; }
  });
  exs.forEach(x=>{ delete x._g; delete x._c; });
  let ori = "Aqueça 5 a 10 minutos antes de começar.";
  if(p.retorno) ori += " Você está voltando a treinar: use cargas leves nas 2 primeiras semanas e aumente aos poucos.";
  if(intens==="leve") ori += " Treino mais leve para um dia de pouca energia: foque na execução e na contração.";
  if(intens==="forte") ori += " Dia de treino pesado: tente superar a carga do último treino mantendo a execução.";
  if(obj==="emagrecimento") ori += " Finalize com 15 a 20 minutos de cardio.";
  if(obj==="condicionamento") ori += " Mantenha os descansos curtos.";
  return {id:"dyn", nome:`Dinâmico · ${F.label}`, letra:"D", nivel:p.nivel, foco:`${OBJ[obj].curto} · intensidade ${INT[intens].label.toLowerCase()}`, orientacao:ori, exercicios:exs, criadoEm:new Date().toISOString(), focoKey, intens};
}
function prescrever(e,obj,lvl,intens,ret){
  const comp=!!e[3]; let s,r,d;
  if(obj==="forca"){ s=comp?5:3; r=comp?"4-6":"8-10"; d=comp?150:90; }
  else if(obj==="emagrecimento"){ s=3; r="12-15"; d=40; }
  else if(obj==="condicionamento"){ s=3; r="12-15"; d=45; }
  else { s=comp?4:3; r=comp?"8-10":"10-12"; d=comp?90:60; }
  if(lvl===0){ s=Math.min(s,3); if(obj==="forca"||obj==="hipertrofia") r=comp?"10-12":"12"; if(obj==="forca") d=90; }
  if(intens==="leve"){ s=Math.max(2,s-1); d+=15; }
  if(intens==="forte" && comp) s+=1;
  if(ret) s=Math.max(2,s-1);
  if(e[1]==="core"){ s=3; r=e[2]==="plank"?"30-45s":"15-20"; d=30; }
  if(e[1]==="panturrilha"){ r="15-20"; d=30; }
  return {nome:e[0], series:s, reps:r, descanso:fmtDesc(d), obs:(intens==="forte"&&comp&&e[1]!=="core"&&!ret)?"Última série até a falha":"", anim:e[2], _g:e[1], _c:comp};
}

function calorias(p){
  const w=num(p.peso), h=num(p.altura), a=num(p.idade); if(!w||!h||!a||!p.sexo||a<18) return null;
  const bmr=10*w+6.25*h-5*a+(p.sexo==="Masculino"?5:-161), af={2:1.375,3:1.45,4:1.55,5:1.65,6:1.725}[p.dias]||1.45;
  let t=bmr*af; if(p.objetivo==="hipertrofia") t*=1.1; else if(p.objetivo==="forca") t*=1.05; else if(p.objetivo==="emagrecimento") t=Math.max(t-400,bmr*1.1);
  return (Math.round(t/50)*50).toLocaleString("pt-BR")+" kcal";
}

}

const fmt1 = n => (Math.round(n*10)/10).toString().replace(".",",");
const DIA = 864e5;
function analise(ss, p, lib){
  ss = ss || []; const now=Date.now();
  const media = ss.filter(s=>now-Date.parse(s.fim)<28*DIA).length/4, meta = +(p.dias||3);
  const ex={};
  ss.filter(s=>now-Date.parse(s.fim)<60*DIA).slice().reverse().forEach(s=>(s.exs||[]).forEach(e=>{ const v=(e.sets||[]).map(x=>x.carga).filter(x=>x!=null); if(v.length) (ex[e.nome]=ex[e.nome]||[]).push(Math.max(...v)); }));
  const comp=Object.entries(ex).filter(([,a])=>a.length>=2).map(([n,a])=>({n,d:a[a.length-1]-a[0],de:a[0],para:a[a.length-1]}));
  const melhorou=comp.filter(c=>c.d>0).sort((a,b)=>b.d-a.d);
  const primeiro = ss.length ? ss[ss.length-1].fim : null;
  const nivel=(lib&&lib.nivel)||p.nivel||"Iniciante";
  const desde=Date.parse((lib&&lib.nivel&&lib.ultimaAvaliacao)||p.nivelDesde||p.criadoEm||primeiro||new Date().toISOString());
  const diasNivel=Math.max(0,Math.floor((now-desde)/DIA));
  const base=Date.parse((lib&&lib.ultimaAvaliacao)||p.criadoEm||primeiro||new Date().toISOString());
  const curto=!(lib&&lib.ultimaAvaliacao) && (nivel==="Iniciante" || !!p.retorno);
  const ciclo=(lib&&+lib.cicloDias)||(curto?30:60), prox=base+ciclo*DIA, diasProx=Math.ceil((prox-now)/DIA);
  const crit=[
    {ok:media>=meta*.75, t:`Frequência: ${fmt1(media)} treinos por semana (meta ${meta})`},
    {ok:comp.length>=3 && melhorou.length/comp.length>=.5, t: comp.length ? `Carga: subiu em ${melhorou.length} de ${comp.length} exercícios nos últimos 60 dias` : "Carga: registre as cargas nos treinos para medir"},
    {ok:diasNivel>=60, t:`Tempo no nível ${nivel}: ${diasNivel} dias (mínimo 60)`}
  ];
  return {media,meta,comp,melhorou,nivel,diasNivel,prox,diasProx,ciclo,crit,pronto:crit.every(c=>c.ok) && nivel!=="Avançado"};
}

const FICHAS_SEED = {};
function mockDB(){
  let store; try{ const raw=localStorage.getItem("brabus.demo.db"); store=raw?new Map(JSON.parse(raw)):null; }catch(e){ store=null; }
  if(!store) store=new Map(Object.entries(seedDB()));
  const subs=[], cp=o=>JSON.parse(JSON.stringify(o));
  const save=()=>{ try{ localStorage.setItem("brabus.demo.db", JSON.stringify([...store])); }catch(e){} };
  save();
  const parent=p=>p.split("/").slice(0,-1).join("/");
  const snapDoc=p=>{ const d=store.get(p); return {id:p.split("/").pop(), exists:!!d, data:()=>d?cp(d):undefined, metadata:{fromCache:false,hasPendingWrites:false}}; };
  const colSnap=c=>{ const docs=[...store.keys()].filter(k=>parent(k)===c).map(snapDoc); return {docs, size:docs.length, empty:!docs.length, docChanges:()=>[], metadata:{}}; };
  const notify=p=>setTimeout(()=>subs.forEach(s=>{ if(s.t==="d"&&s.p===p) s.cb(snapDoc(p)); if(s.t==="c"&&s.p===parent(p)) s.cb(colSnap(s.p)); }));
  const docRef=p=>({id:p.split("/").pop(), path:p,
    get:async()=>snapDoc(p),
    set:async d=>{ store.set(p,cp(d)); save(); notify(p); },
    update:async d=>{ store.set(p,{...(store.get(p)||{}),...cp(d)}); save(); notify(p); },
    delete:async()=>{ store.delete(p); save(); notify(p); },
    onSnapshot:cb=>{ const s={t:"d",p,cb}; subs.push(s); setTimeout(()=>cb(snapDoc(p))); return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; },
    collection:c=>colRef(p+"/"+c)});
  const colRef=p=>{ const q={path:p, doc:id=>docRef(p+"/"+(id||Math.random().toString(36).slice(2,12))), add:async d=>{ const r=docRef(p+"/"+Math.random().toString(36).slice(2,12)); await r.set(d); return r; },
    get:async()=>colSnap(p), onSnapshot:cb=>{ const s={t:"c",p,cb}; subs.push(s); setTimeout(()=>cb(colSnap(p))); return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; },
    where(){ return q; }, orderBy(){ return q; }, limit(){ return q; }}; return q; };
  return {doc:docRef, collection:colRef};
}

  const ult3=ss.filter(s=>now-Date.parse(s.fim)<72*H).length;
  if(ult3>=3) return {k:"leve", motivo:`${ult3} treinos nos últimos 3 dias, hoje é dia de recuperar`};

/* ---------- Repetições, carga sugerida e estagnação ---------- */
function parseFaixa(t){ t=String(t||""); if(/\d\s*s\b|seg|min/i.test(t)) return null; const m=t.match(/(\d+)\s*(?:-|–|a)\s*(\d+)/); if(m) return [+m[1],+m[2]]; const n=t.match(/^\s*(\d+)/); return n?[+n[1],+n[1]]:null; }
function ultimaExec(nome){ for(const s of S.sessoes){ if(s.leve) continue; const e=(s.exs||[]).find(x=>x.nome===nome); if(!e) continue; const fs=e.sets.filter(x=>x.feito&&x.carga!=null&&x.carga>0); if(fs.length) return {s,e,fs}; } return null; }
const incDe=top=>top<10?1:top<30?2:2.5;
const arr=kg=>Math.max(0.5,Math.round(kg*2)/2);
const NF_NIVEL={"Iniciante":.85,"Intermediário":1,"Avançado":1.05};
function cargaSugerida(nome,n,repsTxt,nivel){

  const {s,e,fs}=u, top=Math.max(...fs.map(x=>x.carga)), feitas=e.sets.filter(x=>x.feito).length, qd=diasAtras(s.fim).toLowerCase();
  const fx=parseFaixa(repsTxt), noTopo=fs.filter(x=>x.carga>=top), reps=noTopo.map(x=>x.reps).filter(x=>x!=null);
  let r;
  if(fx && reps.length){
    const tx=reps.join(", "), todas=feitas>=n && reps.length>=Math.min(n,noTopo.length) && noTopo.length>=Math.min(n,fs.length);
    if(todas && Math.min(...reps)>=fx[1]) r={kg:arr(top+incDe(top)), sobe:true, motivo:`última: ${fmtKg(top)} kg × ${tx} (${qd}). Você fechou ${fx[1]} repetições, pode subir.`};
    else if(Math.max(...reps)<fx[0]-1) r={kg:arr(top*0.92), desce:true, motivo:`última: ${fmtKg(top)} kg × ${tx} (${qd}), abaixo de ${fx[0]}. Baixe um pouco e faça a faixa toda.`};
    else r={kg:top, motivo:`última: ${fmtKg(top)} kg × ${tx} (${qd}). Busque ${fx[1]} repetições em todas as séries antes de subir.`};
  }

/* ---------- Resumo da semana ---------- */
function resumoSemana(wk){
  const fimW=wk+7*DIA, inW=t=>{ const x=Date.parse(t); return x>=wk && x<fimW; }, p=S.perfil||{};
  const ss=S.sessoes.filter(s=>inW(s.fim)), meta=+(p.dias||3), min=ss.reduce((a,s)=>a+(s.min||0),0), cd=cardioSemana(wk);
  const maxEx=lista=>{ const o={}; lista.forEach(s=>(s.exs||[]).forEach(e=>{ const v=e.sets.filter(x=>x.feito&&x.carga!=null).map(x=>x.carga); if(v.length) o[e.nome]=Math.max(o[e.nome]||0,...v); })); return o; };
  const antes=maxEx(S.sessoes.filter(s=>Date.parse(s.fim)<wk)), agora=maxEx(ss);
  const subidas=Object.entries(agora).filter(([n,v])=>antes[n]!=null&&v>antes[n]).map(([n,v])=>({n,de:antes[n],para:v,d:v-antes[n]})).sort((a,b)=>b.d/b.de-a.d/a.de);
  const pesos=S.pesos||[], pw=pesos.filter(x=>inW(x.data)), ant=pesos.filter(x=>Date.parse(x.data)<wk).pop();
  const pesoD=pw.length&&ant?pw[pw.length-1].kg-ant.kg:pw.length>=2?pw[pw.length-1].kg-pw[0].kg:null;
  const M=metasDia(p), all=LS.get("brabus.diario",{})||{}, dias=[...Array(7)].map((_,i)=>diaKey(wk+i*DIA+3600e3)).map(k=>all[k]).filter(Boolean);
  const diasAgua=M?dias.filter(x=>x.agua>=M.agua*1000*0.9).length:0, diasProt=M?dias.filter(x=>(x.protTot||0)>=M.P*0.9).length:0;
  const plan=diasSemana(), hojeIdx=wk===semanaKey(Date.now())?ORD_SEM.indexOf(new Date().getDay()):7, feitosD=new Set(ss.map(s=>new Date(s.fim).getDay()));
  const perdidos=plan.filter(d=>ORD_SEM.indexOf(d)<hojeIdx && !feitosD.has(d));
  const est=[...new Set(ss.flatMap(s=>(s.exs||[]).map(e=>e.nome)))].filter(estagnado);
  const foco=[];
  if(ss.length<meta) foco.push(`Garanta os ${meta} treinos: ${plan.map(d=>DOW[d]).join(", ")}.`);
  if(est.length) foco.push(`Mude o estímulo em ${est.slice(0,2).join(" e ")}: troque a variação ou a faixa de repetições.`);
  if(dias.length && M && diasProt<5) foco.push(`Bata a proteína (${M.P} g) em pelo menos 5 dias.`);
  if(dias.length && M && diasAgua<5) foco.push(`Beba ${String(M.agua).replace(".",",")} L de água em pelo menos 5 dias.`);
  if(cd.min<alvoCardio() && (p.objetivo==="emagrecimento"||p.objetivo==="condicionamento")) foco.push(`Some ${alvoCardio()-cd.min} min de cardio.`);
  if(!foco.length) foco.push(subidas.length?"Semana forte. Siga subindo a carga quando fechar as repetições.":"Tente subir a carga em pelo menos um exercício por treino.");
  return {wk,ss,n:ss.length,meta,min,cd,subidas,pesoD,diasAgua,diasProt,temDiario:dias.length>0,perdidos,est,foco:foco.slice(0,3)};
}
function resumoHTML(){
  if(!S.perfil) return "";

  const rng=`${new Date(wk).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} a ${new Date(wk+6*DIA).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}`;

  if(r.temDiario) lin.push(`<li><b>Água na meta:</b> ${r.diasAgua} de 7 dias · <b>Proteína:</b> ${r.diasProt} de 7</li>`);
  if(r.perdidos.length) lin.push(`<li><b>Faltou:</b> ${r.perdidos.map(d=>DOW[d]).join(", ")}</li>`);
  return `<div class="panel resumo-sem"><div class="row" style="justify-content:space-between"><div class="seg2" role="group" aria-label="Semana"><button data-act="semSel" data-k="esta" aria-pressed="${!passada}">Esta semana</button><button data-act="semSel" data-k="passada" aria-pressed="${passada}">Passada</button></div><span class="presc">${rng}</span></div>
    <div class="resumo-n tres"><div><b>${r.n}<em>/${r.meta}</em></b><small>treinos</small></div><div><b>${r.min+r.cd.min}<em>min</em></b><small>de atividade</small></div><div><b>${r.pesoD==null?"–":(r.pesoD>0?"+":"")+fmtKg(Math.round(r.pesoD*10)/10)}${r.pesoD==null?"":"<em>kg</em>"}</b><small>peso</small></div></div>
    ${lin.length?`<ul class="ref-it">${lin.join("")}</ul>`:""}
    <div class="foco"><span class="eyebrow">${passada?"Para esta semana":"Para fechar bem a semana"}</span><ul class="ref-it">${r.foco.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div></div>`;
}

function presPerso(e,corpo,lvl,g,lim){
  const comp=!!e[3], foco=(g==="gluteo"||g==="quad")&&comp; let s=3,r,d;
  if(corpo==="massa"){ s=comp?4:3; r=comp?"8-10":"10-12"; d=comp?90:60; }
  else if(corpo==="curvas"){ s=foco?4:3; r=foco?"8-12":"12-15"; d=comp?75:50; }
  else if(corpo==="magro"||corpo==="saude"){ r=comp?"12-15":"15"; d=comp?50:40; }
  else { r="10-12"; d=comp?70:50; }
  if(lvl===0){ s=Math.min(s,3); const fx=parseFaixa(r); if(fx&&fx[0]<10) r="10-12"; }
  if(g==="core"){ s=3; r=/Prancha/.test(e[0])?"30-45s":"15-20"; d=30; }
  if(g==="panturrilha"){ r="15-20"; d=30; }
  if(/Afundo|búlgaro/.test(e[0])) r+=" cada perna";
  let obs="";
  if(g==="gluteo" && comp) obs="Segure 1s no topo contraindo o glúteo";
  if(lim.includes("joelho") && (g==="quad"||/sumô/.test(e[0]))) obs="Amplitude confortável, sem dor no joelho";
  if(lim.includes("lombar") && /Stiff|Remada|Elevação pélvica/.test(e[0])) obs="Coluna neutra e abdômen firme. Se doer, pare e troque";
  if(lim.includes("ombro") && (g==="ombro"||g==="peito")) obs="Cotovelos um pouco à frente do corpo, sem dor no ombro";
  return {nome:e[0], series:s, reps:r, descanso:fmtDesc(d), obs, anim:e[2]||""};
}
function oriPerso(p,corpo,inc,lim){
  let t=`Montado para você: ${CORPO[corpo].toLowerCase()}${inc.length?`, com atenção a ${inc.map(x=>INCOMODA[x].toLowerCase()).join(", ")}`:""}. Aqueça 5 a 10 minutos antes.`;
  if(corpo==="magro"||corpo==="saude"||inc.includes("barriga")||inc.includes("cintura")) t+=" Finalize com 20 minutos de cardio (esteira inclinada ou bike).";
  if(corpo==="curvas"||inc.includes("gluteos")) t+=" Nos exercícios de glúteo, controle a descida e contraia no topo.";
  if(corpo==="massa") t+=" Suba a carga quando fechar o topo das repetições.";

}
function montarPlanoPerso(){
  const p=S.perfil, n=Math.min(6,Math.max(2,diasSemana(p).length)), inc=p.incomoda||[], lim=p.limites||[], corpo=corpoDe(p);
  const lvl=Math.max(0,NIVEIS.indexOf((!S.owner&&S.lib&&S.lib.nivel)||p.nivel||"Iniciante"));
  const low=(corpo==="curvas"?2:0)+inc.filter(x=>x==="gluteos"||x==="coxas").length+(p.sexo==="Feminino"?1:0);
  const up=inc.filter(x=>["bracos","costas","peito"].includes(x)).length+(corpo==="massa"&&p.sexo!=="Feminino"?2:0);
  const core=inc.some(x=>x==="barriga"||x==="cintura");
  const SPL = low>=up ? {2:["F","F"],3:["G","S","Q"],4:["G","S","Q","SC"],5:["G","S","Q","SC","G"],6:["G","S","Q","SC","G","S"]}
                      : {2:["F","F"],3:["S","L","SC"],4:["S","L","SC","L"],5:["S","L","SC","L","S"],6:["S","L","SC","L","S","L"]};
  const rot={};
  return SPL[n].map((t,i)=>{
    const plan=DIA_T[t].plan.map(([g,c])=>[g,c]), bump=g=>{ const x=plan.find(y=>y[0]===g); if(x) x[1]++; else plan.splice(plan.length-1,0,[g,1]); };
    if(t==="S"||t==="SC"){ if(inc.includes("bracos")) bump("triceps"); if(inc.includes("costas")) bump("costas"); if(inc.includes("peito")) bump("peito"); }
    if((t==="G"||t==="Q"||t==="L") && inc.includes("coxas")) bump("gluteo");
    if(core && !plan.some(y=>y[0]==="core")) plan.push(["core",1]);
    const usados=new Set(), exs=[];
    plan.forEach(([g,c])=>{
      const pool=(ORDEM_G[g]||[]).map(nm=>LIB.find(e=>e[0]===nm)).filter(e=>e && e[4]<=lvl && !lim.some(l=>EVITAR[l].test(e[0])));
      let pos=rot[g]||0; for(let k=0;k<c;k++){ let e=null; for(let t=0;t<pool.length;t++){ const x=pool[(pos+t)%pool.length]; if(!usados.has(x[0])){ e=x; pos=(pos+t+1)%pool.length; break; } } if(!e) break; usados.add(e[0]); exs.push(presPerso(e,corpo,lvl,g,lim)); } rot[g]=pos;
    });
    const L="ABCDEF"[i];
    return {id:"perso-"+L, nome:`Treino ${L}`, letra:L, nivel:"Meus treinos", perso:true, ordem:i+1, foco:DIA_T[t].label, orientacao:oriPerso(p,corpo,inc,lim), exercicios:exs.slice(0,8)};
  });
}

function ajustarIntens(f){

function treinoFocado(txt){

const CAT_PRONTO=["Ganho de massa","Definição","Perda de peso","Bodybuilder"];
const SUBST_INI={"Barra fixa":"Puxada frontal","Barra fixa pegada aberta":"Puxada frontal","Levantamento terra":"Stiff com halteres","Levantamento terra parcial (rack pull)":"Stiff com halteres",
 "Agachamento livre":"Agachamento no smith","Agachamento frontal":"Leg press 45","Supino reto com barra":"Supino reto na máquina","Supino inclinado com barra":"Supino inclinado na máquina",
 "Remada curvada com barra":"Remada baixa","Remada cavalinho (barra T)":"Remada baixa","Paralelas":"Tríceps na polia","Desenvolvimento militar com barra":"Desenvolvimento na máquina",

 "Agachamento no cinto (belt squat)":"Leg press 45","Agachamento hack linear":"Leg press 45"};
const TECN=/drop|falha|bi-set|rest-pause|fst|pir[aâ]mide|parciais|tire carga|retirada|descanse 30s/i;
const cacheAj=new WeakMap();
const TXT_NIVEL={"Iniciante":"Menos séries, 10 a 12 repetições, exercícios mais simples e cargas mais leves.","Intermediário":"O treino como ele é, com as cargas do seu nível.","Avançado":"Mais séries, falha e drop set, e cargas mais altas."};
const nivelPadrao=()=>S.nivelPronto||(S.perfil&&S.perfil.nivel)||"Intermediário";
function nivelDe(f){ return (S.atual&&f&&S.atual.fichaId===f.id&&S.atual.nivelPronto)||nivelPadrao(); }
function ajustar(f){
  if(f && f.perso) return ajustarIntens(f);
  if(!f || !CAT_PRONTO.includes(f.nivel)) return f;
  const nv=nivelDe(f); if(nv==="Intermediário") return f;
  let m=cacheAj.get(f); if(!m){ m={}; cacheAj.set(f,m); } if(m[nv]) return m[nv];
  let exs=(f.exercicios||[]).map(e=>({...e}));
  if(nv==="Iniciante"){
    const vistos=new Set();
    exs=exs.map(e=>{ const sub=SUBST_INI[e.nome], x={...e, nome:sub||e.nome, anim:sub?"":e.anim, obs:sub?"":e.obs};
      x.series=Math.max(2,(+x.series||3)-1);
      const r=String(x.reps||""), nums=(r.match(/\d+/g)||[]).map(Number);
      if(!nums.length || /,|\d+-\d+-\d+/.test(r) || (Math.min(...nums)<8 && !/s$|passos|perna/.test(r))) x.reps=/s$/.test(r)?r:"10-12";
      if(TECN.test(x.obs||"")||TECN.test(r)) x.obs="Foque na técnica, sem ir até a falha";
      x.descanso = /sem descanso|15s/i.test(x.descanso||"") ? "60s" : fmtDesc(Math.min(180,descSeg(x.descanso)+15));
      return x; }).filter(e=>{ if(vistos.has(e.nome)) return false; vistos.add(e.nome); return true; }).slice(0,6);
  } else {
    exs.forEach((e,i)=>{ if(i<2 && /^\d+(-\d+)?$/.test(String(e.reps).trim())) e.series=(+e.series||3)+1; });
    if(exs[0] && !TECN.test(exs[0].obs||"")) exs[0].obs=(exs[0].obs?exs[0].obs+". ":"")+"Última série até a falha";
    const last=exs[exs.length-1]; if(last && !TECN.test(last.obs||"")) last.obs=(last.obs?last.obs+". ":"")+"Drop set na última série";
  }
  const pre = nv==="Iniciante" ? "Versão iniciante: menos séries, exercícios mais seguros e foco na técnica. " : "Versão avançada: uma série a mais nos principais, falha e drop set. ";
  return (m[nv]={...f, exercicios:exs, nivelAjustado:nv, orientacao:pre+(f.orientacao||"")});
}

      snap.docs.forEach(d=>{ const x=d.data(); if(x.tipo==="sessao" && !ids.has(x.id)) S.sessoes.push(clone(x)); else if(x.tipo==="atual") ra=x; else if(x.tipo==="perfil") rp=x; else if(x.tipo==="dyn") rd=x; else if(x.tipo==="aval" && !S.aval){ const {tipo,...r}=clone(x); S.aval=r; LS.set("brabus.aval",r); } else if(x.tipo==="cupons"){ const rl=clone(x.lista||[]); if(rl.length>(S.cupons||[]).length){ S.cupons=rl; LS.set("brabus.cupons",{lista:rl}); } } else if(x.tipo==="pesos" && !(S.pesos||[]).length){ S.pesos=clone(x.lista||[]); LS.set("brabus.pesos",{lista:S.pesos}); } });
      if(!S.perfil && rp){ const {tipo, ...r} = clone(rp); S.perfil=r; LS.set("brabus.perfil", r); }
      if(!S.dyn && rd){ const {tipo, ...r} = clone(rd); S.dyn=r; LS.set("brabus.dyn", r); }
      S.sessoes.sort((a,b)=>String(b.fim).localeCompare(String(a.fim)));
      LS.set("brabus.sessoes", S.sessoes);
      if(!S.atual && ra){ const {tipo, ...rest} = clone(ra); S.atual = rest; LS.set("brabus.atual", S.atual); }
    }catch(e){ S.mode="local"; }
    db.doc("liberacoes/"+S.uid).onSnapshot(d=>{ S.lib = d.exists ? clone(d.data()) : null; render(); checkCupons(); }, ()=>{});
    if(S.perfil) db.doc("alunos/"+S.uid).get().then(d=>{ if(!d.exists) syncAluno(); }).catch(()=>{});
    checkCupons();
    render();
  }
  {
    db.collection("alunos").onSnapshot(snap=>{ S.alunos = snap.docs.map(d=>({id:d.id, ...clone(d.data())})); if(S.view==="alunos") render(); }, ()=>{});
    db.collection("liberacoes").onSnapshot(snap=>{ S.libs={}; snap.docs.forEach(d=>{ S.libs[d.id]=clone(d.data()); }); if(S.view==="alunos") render(); }, ()=>{});
  }
}

function getSets(i, n){

function ensureAtual(f){

function diasAtras(iso){ const a=new Date(iso); a.setHours(0,0,0,0); const b=new Date(); b.setHours(0,0,0,0); const d=Math.round((b-a)/864e5); return d<=0?"Hoje":d===1?"Ontem":`Há ${d} dias`; }
function lastCarga(nome){
  for(const s of S.sessoes){
    const e = (s.exs||[]).find(x=>x.nome===nome);
    if(e){ const v = e.sets.filter(x=>x.carga!=null).map(x=>x.carga); if(v.length) return Math.max(...v); }

function progresso(f){
  const total = (f.exercicios||[]).reduce((a,e)=>a+(+e.series||0),0);

}

function chartSemanas(){
  const W=320,H=120,pad=22, semanas=[];
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const ini = new Date(hoje); ini.setDate(ini.getDate()-((ini.getDay()+6)%7)); // segunda
  for(let k=7;k>=0;k--){ const a=new Date(ini); a.setDate(a.getDate()-7*k); const b=new Date(a); b.setDate(b.getDate()+7);
    semanas.push({a, n:S.sessoes.filter(s=>{const d=new Date(s.fim); return d>=a && d<b;}).length}); }
  const max = Math.max(4, ...semanas.map(s=>s.n));
  const bw=(W-pad)/8;
  let g = `<line x1="${pad}" x2="${W}" y1="${H-pad}" y2="${H-pad}" stroke="var(--line)"/>`;
  [0,Math.round(max/2),max].forEach(v=>{ const y=(H-pad)-(v/max)*(H-pad-8); g+=`<text x="0" y="${y+4}" font-size="10" fill="var(--dust)">${v}</text>`; if(v) g+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/>`; });
  semanas.forEach((s,i)=>{ const h=(s.n/max)*(H-pad-8), x=pad+i*bw+bw*.2;
    g+=`<rect x="${x}" y="${H-pad-h}" width="${bw*.6}" height="${Math.max(h,0)}" rx="3" fill="${i===7?"var(--ember)":"var(--rock-3)"}"/>`;
    g+=`<text x="${x+bw*.3}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--dust)">${s.a.getDate()}/${s.a.getMonth()+1}</text>`;
    if(s.n) g+=`<text x="${x+bw*.3}" y="${H-pad-h-4}" font-size="10" text-anchor="middle" fill="var(--chalk)">${s.n}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Treinos por semana">${g}</svg>`;
}
function chartCarga(nome, ss=S.sessoes){
  const pts = ss.slice().reverse().map(s=>{ const e=(s.exs||[]).find(x=>x.nome===nome); if(!e) return null; const v=e.sets.map(x=>x.carga).filter(x=>x!=null); return v.length?{d:s.fim,v:Math.max(...v)}:null; }).filter(Boolean).slice(-12);
  if(!pts.length) return "";
  const W=320,H=140,L=34,R=12,T=16,B=22;
  const vs=pts.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs); if(lo===hi){lo=Math.max(0,lo-5); hi=hi+5;}
  const x=i=> pts.length===1 ? (L+W-R)/2 : L+i*(W-L-R)/(pts.length-1);
  const y=v=> T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g="";
  [lo,(lo+hi)/2,hi].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--dust)">${fmtKg(v)}</text>`; });
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.v)}`).join("");
  if(pts.length>1) g+=`<path d="${line}L${x(pts.length-1)},${H-B}L${x(0)},${H-B}Z" fill="var(--ember-soft)"/><path d="${line}" fill="none" stroke="var(--ember)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{ const last=i===pts.length-1; g+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="${last?5:3}" fill="${last?"var(--ember)":"var(--rock-2)"}" stroke="var(--ember)" stroke-width="2"/>`; });
  const lp=pts[pts.length-1], fp=pts[0];
  g+=`<text x="${L}" y="${H-6}" font-size="10" fill="var(--dust)">${new Date(fp.d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</text><text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--dust)">${new Date(lp.d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</text>`;
  const dif = lp.v-fp.v;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de carga">${g}</svg><span class="presc">Atual <strong>${fmtKg(lp.v)} kg</strong>${pts.length>1?` · ${dif>=0?"+":""}${fmtKg(dif)} kg desde ${new Date(fp.d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}`:""}</span>`;
}
