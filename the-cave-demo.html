    stopTimer(); S.prsHoje={}; S.atual=null; saveAtual(); await saveSessao(s); syncAluno(); checkCupons(); toast(recs?`Treino concluído com ${recs} recorde${recs>1?"s":""}!`:"Treino concluído. Bom trabalho!"); go("historico");
  }
  else if(act==="editar"){ const f=fichaById(S.fichaId); S.editing={...clone(f)}; S.editing.exercicios=S.editing.exercicios||[]; render(); window.scrollTo(0,0); }
  else if(act==="nova"){ S.fichaId="f-"+Date.now().toString(36); S.editing={_novo:true,id:S.fichaId,nome:"",letra:"",nivel:S.nivel!=="Todos"?S.nivel:"Iniciante",ordem:S.fichas.length+1,foco:"",orientacao:"",exercicios:[{nome:"",series:3,reps:"10-12",descanso:"60s"}]}; S.view="ficha"; render(); window.scrollTo(0,0); }
  else if(act==="cancelar"){ const novo=S.editing&&S.editing._novo; S.editing=null; if(novo) go("treinos"); else render(); }
  else if(act==="exadd"){ S.editing.exercicios.push({nome:"",series:3,reps:"10-12",descanso:"60s"}); render(); }
  else if(act==="exdel"){ S.editing.exercicios.splice(+b.dataset.i,1); render(); }
  else if(act==="exup"){ const i=+b.dataset.i; if(i>0){ const a=S.editing.exercicios; [a[i-1],a[i]]=[a[i],a[i-1]]; render(); } }
  else if(act==="salvar"){
    const e=S.editing; if(!e.nome.trim()){ toast("Dê um nome à ficha"); return; }
    const exs=e.exercicios.filter(x=>String(x.nome||"").trim()).map(x=>({nome:x.nome.trim(), series:Math.max(1,parseInt(x.series)||3), reps:String(x.reps||"").trim(), descanso:String(x.descanso||"").trim(), obs:String(x.obs||"").trim(), anim:String(x.anim||"")}));
    const {_novo, id:_eid, ...extra} = e; const body={...extra, nome:e.nome.trim(), letra:String(e.letra||"").trim().toUpperCase(), nivel:e.nivel, ordem:parseInt(e.ordem)||99, foco:String(e.foco||"").trim(), orientacao:String(e.orientacao||"").trim(), exercicios:exs};
    b.disabled=true;
    try{ await S.db.doc("fichas/"+e.id).set(body); S.editing=null; toast("Ficha salva"); render(); }
    catch(err){ b.disabled=false; toast("Não foi possível salvar. Só o dono do app pode editar fichas."); }
  }
  else if(act==="excluir"){
    if(prevConfirm!=="excluir"){ S.confirm="excluir"; render(); return; }
    try{ await S.db.doc("fichas/"+S.editing.id).delete(); S.editing=null; toast("Ficha excluída"); go("treinos"); }catch{ toast("Não foi possível excluir a ficha"); }
  }
  else if(act==="publicarAviso"){
    const a=S.novoAviso; if(!a.titulo.trim()||!a.texto.trim()){ toast("Preencha título e mensagem"); return; }
    b.disabled=true;
    try{ await S.db.doc("avisos/a-"+Date.now().toString(36)).set({titulo:a.titulo.trim(), texto:a.texto.trim(), criadoEm:new Date().toISOString()}); S.novoAviso={titulo:"",texto:""}; toast("Aviso publicado"); render(); }
    catch{ b.disabled=false; toast("Não foi possível publicar o aviso"); }
  }
  else if(act==="delAviso"){
    const k="aviso:"+b.dataset.id;
    if(prevConfirm!==k){ S.confirm=k; render(); return; }
    try{ await S.db.doc("avisos/"+b.dataset.id).delete(); toast("Aviso excluído"); }catch{ toast("Não foi possível excluir"); }
  }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.dataset.act==="carga"){
    const f=fichaById(S.fichaId); if(!f) return;
    const wasNew=!S.atual; if(!ensureAtual(f)) return;
    const i=+t.dataset.i, j=+t.dataset.j; getSets(i, Math.max(1,+f.exercicios[i].series||1))[j].c=t.value;
    saveAtual(); if(wasNew){ $("#cta").innerHTML=ctaFicha(); }
  }
  else if(t.dataset.ef!==undefined && S.editing){ S.editing[t.dataset.ef]=t.value; }
  else if(t.dataset.ex!==undefined && S.editing){ S.editing.exercicios[+t.dataset.ex][t.dataset.k]=t.value; }
  else if(t.dataset.av){ S.novoAviso[t.dataset.av]=t.value; }
  else if(t.dataset.onb){ S.onbDraft=S.onbDraft||{}; S.onbDraft[t.dataset.onb]=t.value; }
  else if(t.dataset.fis && S.avDraft){ S.avDraft[t.dataset.fis]=t.value; }
  else if(t.dataset.cupom){ S.cupomBusca=t.value.toUpperCase().trim(); render(); }
  else if(t.dataset.busca){ S.busca=t.value; render(); }
  else if(t.dataset.lib==="nota" && S.libDraft){ S.libDraft.nota=t.value; }
  else if(t.dataset.pf && S.pfDraft){ S.pfDraft[t.dataset.pf]=t.value; const n=$("#pf-nivel"); const d=S.pfDraft; if(n && d.exp && d.sit) n.innerHTML=`Seu nível no app: <b style="color:var(--chalk)">${calcNivel(d)}</b>${ehRetorno(d)?" · retorno aos treinos":""}`; }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape") ANIM.close(); });
document.addEventListener("change", ev=>{ if(ev.target.dataset.act==="evo"){ S.evoEx=ev.target.value; render(); } const lb=ev.target.dataset.lib; if(lb && S.libDraft){ if(lb==="ficha"){ const id=ev.target.value; S.libDraft.fichas = ev.target.checked ? [...new Set([...S.libDraft.fichas,id])] : S.libDraft.fichas.filter(x=>x!==id); } else if(lb!=="nota") S.libDraft[lb]=ev.target.checked; }
  const ls=ev.target.dataset.libsel; if(ls && S.libDraft){ S.libDraft[ls] = ls==="cicloDias" ? +ev.target.value : ev.target.value; }
  if(ev.target.dataset.act==="evoAluno"){ S.evoAluno=ev.target.value; render(); }
  if(ev.target.dataset.act==="nutriFicha"){ S.nutriFicha=ev.target.value||null; render(); } });

const heroLogo = () => `<section class="hero done"><div class="hero-cap"><b class="brand-big">THE CAVE</b><span>CT FT · A marca dos campeões</span></div></section>`;

function vLendas(lista){
  const grupos=[];
  lista.forEach(f=>{ const k=f.lenda||f.nome; let g=grupos.find(x=>x.k===k); if(!g){ g={k,f,itens:[]}; grupos.push(g); } g.itens.push(f); });
  return `<section class="nivel-group"><h2>Bodybuilder</h2><p class="note" style="margin:0">Treinos inspirados no estilo de lendas do fisiculturismo. Mais volume e intensidade, para quem já treina há um tempo.</p>
  ${grupos.map(g=>`<article class="lenda"><div class="lenda-top">${g.f.titulos?`<span class="titulos">${esc(g.f.titulos)}</span>`:""}<div class="lenda-id"><span class="eyebrow">${esc(g.f.era||"")}</span><h3>${esc(g.k)}</h3><small>${esc(g.f.estilo||"")}</small></div></div>
  <div class="lenda-fichas">${g.itens.map(f=>`<button class="lf" data-act="abrir" data-id="${esc(f.id)}"><span><b>${esc(f.nome)}</b><small>${esc(f.foco||"")} · ${(f.exercicios||[]).length} exercícios</small></span><span class="go" aria-hidden="true">→</span></button>`).join("")}</div></article>`).join("")}</section>`;
}

/* ---------- Fundo: parede de caverna com pedras caindo ---------- */
(function caveBg(){
  const cv=document.getElementById("cave-bg"); if(!cv || !cv.getContext) return;
  const c=cv.getContext("2d");
  let reduce=false; try{ reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; }catch{}
  const css=getComputedStyle(document.documentElement), tok=v=>css.getPropertyValue(v).trim();
  let W=0,H=0,dpr=1,rocks=[],dust=[],wall=null,raf=0,nextBurst=0;
  const shape=r=>{ const n=5+Math.floor(Math.random()*4), p=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+Math.random()*.4, rr=r*(.55+Math.random()*.55); p.push([Math.cos(a)*rr,Math.sin(a)*rr]); } return p; };
  const rock=(top,x,fast)=>{ const z=Math.random(), r=fast?1.5+Math.random()*3.5:1.8+z*z*9;
    return {x:x??Math.random()*W, y:top?-12-Math.random()*40:Math.random()*H, r, z, vy:fast?2.2+Math.random()*2:(.18+z*.9)*(.6+Math.random()*.6), vx:(Math.random()-.5)*(fast?.6:.12), rot:Math.random()*6, vr:(Math.random()-.5)*.04, p:shape(r), a:.22+z*.45}; };
  const mote=()=>({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.3,vy:.04+Math.random()*.14,vx:(Math.random()-.5)*.08,a:.06+Math.random()*.22,ph:Math.random()*6});
  function buildWall(){
    wall=document.createElement("canvas"); wall.width=Math.round(W*dpr); wall.height=Math.round(H*dpr);
    const w=wall.getContext("2d"); w.scale(dpr,dpr);
    w.fillStyle=tok("--rock"); w.fillRect(0,0,W,H);
    for(let i=0;i<70;i++){ const x=Math.random()*W, y=Math.random()*H, r=30+Math.random()*170, g=w.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0, Math.random()<.5?tok("--stone-hi"):tok("--stone-lo")); g.addColorStop(1,"rgba(0,0,0,0)"); w.fillStyle=g; w.fillRect(x-r,y-r,r*2,r*2); }
    w.strokeStyle=tok("--crack"); w.lineWidth=1;
    for(let i=0;i<22;i++){ let x=Math.random()*W, y=Math.random()*H; w.beginPath(); w.moveTo(x,y); for(let k=0;k<7;k++){ x+=(Math.random()-.5)*50; y+=6+Math.random()*34; w.lineTo(x,y); } w.stroke(); }
    const glow=w.createRadialGradient(W/2,-H*.15,0,W/2,-H*.15,H*.95); glow.addColorStop(0,tok("--glow")); glow.addColorStop(1,"rgba(0,0,0,0)"); w.fillStyle=glow; w.fillRect(0,0,W,H);
    w.fillStyle=tok("--cave-deep"); let x=-10; w.beginPath(); w.moveTo(-10,0);
    while(x<W+10){ const wd=12+Math.random()*38, h=8+Math.random()*(Math.random()<.18?110:38); w.lineTo(x+wd*.45,h); w.lineTo(x+wd*.6,h*.85); w.lineTo(x+wd,2+Math.random()*10); x+=wd; }
    w.lineTo(W+10,0); w.closePath(); w.fill();
    const v=w.createRadialGradient(W/2,H*.45,Math.min(W,H)*.25,W/2,H*.5,Math.max(W,H)*.85); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,tok("--vignette")); w.fillStyle=v; w.fillRect(0,0,W,H);
  }
  function resize(force){
    const nw=innerWidth, nh=innerHeight;
    if(!force && nw===W && Math.abs(nh-H)<140) return;
    W=nw; H=nh; dpr=Math.min(1.5,devicePixelRatio||1);
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    buildWall();
    const n=Math.min(42,Math.round(W*H/20000)); rocks=Array.from({length:n},()=>rock(false)); dust=Array.from({length:Math.min(70,Math.round(W*H/12000))},mote);
    if(reduce) frame(0);
  }
  function drawRock(o){
    c.save(); c.translate(o.x,o.y); c.rotate(o.rot); c.globalAlpha=o.a;
    c.beginPath(); o.p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])); c.closePath();
    c.fillStyle=tok("--pebble"); c.fill(); c.lineWidth=1; c.strokeStyle=tok("--pebble-edge"); c.stroke();
    c.globalAlpha=o.a*.6; c.beginPath(); c.moveTo(o.p[0][0]*.6,o.p[0][1]*.6); c.lineTo(o.p[1][0]*.6,o.p[1][1]*.6); c.strokeStyle=tok("--pebble-hi"); c.stroke();
    c.restore();
  }
  function frame(ts){
    c.setTransform(dpr,0,0,dpr,0,0); c.globalAlpha=1;
    if(wall) c.drawImage(wall,0,0,W,H);
    if(!reduce && ts>nextBurst){ const x=Math.random()*W; for(let i=0;i<4+Math.floor(Math.random()*5);i++) rocks.push(rock(true,x+(Math.random()-.5)*40,true)); nextBurst=ts+5000+Math.random()*7000; }
    c.fillStyle=tok("--dust-mote");
    dust.forEach(d=>{ if(!reduce){ d.y+=d.vy; d.x+=d.vx+Math.sin(ts/2400+d.ph)*.08; if(d.y>H+4){ d.y=-4; d.x=Math.random()*W; } }
      c.globalAlpha=d.a; c.beginPath(); c.arc(d.x,d.y,d.r,0,Math.PI*2); c.fill(); });
    for(let i=rocks.length-1;i>=0;i--){ const o=rocks[i];
      if(!reduce){ o.y+=o.vy; o.x+=o.vx; o.rot+=o.vr; }
      if(o.y>H+20){ if(o.vy>2){ rocks.splice(i,1); continue; } Object.assign(o,rock(true)); }
      drawRock(o); }
    c.globalAlpha=1;
  }
  function loop(ts){ if(!document.hidden) frame(ts); raf=requestAnimationFrame(loop); }
  let rt; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>resize(false),200); });
  resize(true);
  if(!reduce) raf=requestAnimationFrame(loop);
})();

render();
init();
</script>
